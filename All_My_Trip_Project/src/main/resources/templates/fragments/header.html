<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <body>
    <header class="app-header" th:fragment="header(activeMenu)">
      <button class="brand" type="button" data-route="/home" aria-label="All My Trips 홈">
        <img th:src="@{/images/icons/app-icon.png}" src="/images/icons/app-icon.png" alt="" />
        <strong>All My Trips</strong>
      </button>
      <nav aria-label="주 메뉴">
        <button type="button" data-route="/trips/new/basic" data-prefix="/trips"
          th:classappend="${activeMenu == 'trips'} ? 'active' : ''">여행 계획</button>
        <button type="button" data-route="/trips/busan/schedule" data-prefix="/trips/busan"
          th:classappend="${activeMenu == 'schedule'} ? 'active' : ''">여행 일정</button>
        <button type="button" data-route="/guide" data-prefix="/guide"
          th:classappend="${activeMenu == 'guide'} ? 'active' : ''">여행 가이드</button>
        <button type="button" data-route="/booking" data-prefix="/booking"
          th:classappend="${activeMenu == 'booking'} ? 'active' : ''">예약</button>
        <button type="button" data-route="/mypage" data-prefix="/mypage"
          th:classappend="${activeMenu == 'mypage'} ? 'active' : ''">마이 페이지</button>
      </nav>
      <div class="header-actions">
        <button class="login-pill" type="button" data-route="/auth/login">로그인</button>
        <button class="avatar" type="button" data-route="/mypage" aria-label="마이 페이지">민</button>
        <button class="menu-button static-menu-button" type="button" data-directory aria-label="전체 화면 보기">☰</button>
      </div>
    </header>
  </body>
</html>
