<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 기본 정보" />
    <title>여행 기본 정보 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/basic.css}" href="/css/pages/trips/basic.css" />
  </head>
  <body class="page-basic" data-route="/trips/new/basic">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>01 </span>여행 계획</h1>
        <p>몇 가지 정보만 알려주면 딱 맞는 여행을 제안할게요.</p>
        <i>✦</i>
      </div>
      
    <ol class="wizard">
      
        <li class="active">
          <span>1</span><b>기본 정보</b><i></i>
        </li>
      
        <li class="">
          <span>2</span><b>여행 스타일</b><i></i>
        </li>
      
        <li class="">
          <span>3</span><b>추천 결과</b>
        </li>
      
    </ol>
  
    </section>
  
      <section class="form-board">
        <div>
          <h2>어디로 떠나시나요?</h2>
          <button class="input-button" type="button" data-modal="destination">도시, 국가 또는 공항 검색</button>
          <div class="segmented small"><button class="selected">국내</button><button>해외</button></div>
          <h2>여행 기간</h2>
          <div class="date-pair"><button data-modal="date">2026.08.14</button><button data-modal="date">2026.08.17</button></div>
        </div>
        <div>
          <h2>동행자 유형</h2>
          <div class="choice-grid"><button class="">혼자</button><button class="">친구</button><button class="selected">연인</button><button class="">가족</button><button class="">부모님</button><button class="">아이와 함께</button></div>
          <h2>예상 예산</h2><button class="input-button">1인 기준 300,000원</button>
        </div>
        <button class="primary-button form-next" type="button" data-route="/trips/new/style">다음 · 스타일 설정</button>
      </section>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <script th:src="@{/js/common/api.js}" src="/js/common/api.js" defer></script>
    <script th:src="@{/js/common/navigation.js}" src="/js/common/navigation.js" defer></script>
    <script th:src="@{/js/common/modal.js}" src="/js/common/modal.js" defer></script>
    <script th:src="@{/js/pages/trips/basic.js}" src="/js/pages/trips/basic.js" defer></script>
  </body>
</html>
