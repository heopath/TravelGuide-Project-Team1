name: Server Logs

# 임의 명령은 받지 않고 미리 정한 조회만 Oracle Cloud 앱 서버에서 실행합니다.
# 출력은 GitHub Actions 로그에 남으므로 마지막 단계에서 토큰과 개인정보를 가립니다.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "무엇을 볼지"
        required: true
        type: choice
        default: gemini
        options:
          - gemini
          - error
          - startup
          - env
          - recent
      lines:
        description: "몇 줄을 볼지"
        required: false
        type: choice
        default: "200"
        options: ["100", "200", "500"]

jobs:
  logs:
    name: Read logs from Oracle Cloud
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Configure Oracle Cloud SSH
        shell: bash
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/oci_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Read and mask logs
        shell: bash
        env:
          OCI_APP_HOST: ${{ vars.OCI_APP_HOST }}
          OCI_APP_USER: ${{ vars.OCI_APP_USER }}
          TARGET: ${{ inputs.target }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          test -n "$OCI_APP_HOST"
          test -n "$OCI_APP_USER"

          case "$LINES" in
            100|200|500) ;;
            *) echo "::error::허용되지 않은 줄 수: $LINES"; exit 1 ;;
          esac

          case "$TARGET" in
            gemini|error|startup|env|recent) ;;
            *) echo "::error::허용되지 않은 조회: $TARGET"; exit 1 ;;
          esac

          SSH=(ssh -i "$HOME/.ssh/oci_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${OCI_APP_USER}@${OCI_APP_HOST}" \
            "sudo bash -s -- '$TARGET' '$LINES'" \
            < <(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          TARGET="$1"
          LINES="$2"
          UNIT="all-my-trips.service"

          case "$LINES" in
            100|200|500) ;;
            *) exit 2 ;;
          esac

          if [[ "$TARGET" == "env" ]]; then
            systemctl show "$UNIT" -p Environment \
              | tr ' ' '\n' \
              | sed -E 's/^(Environment=)?([A-Z_][A-Z0-9_]*)=.*/\2 = <설정됨>/' \
              | grep -E '= <설정됨>' \
              | sort || true
            exit 0
          fi

          case "$TARGET" in
            gemini)
              journalctl -u "$UNIT" -n "$LINES" --no-pager \
                | grep -i -E 'gemini|여행 초안' || echo '(Gemini 관련 로그 없음)' ;;
            error)
              journalctl -u "$UNIT" -n "$LINES" --no-pager \
                | grep -E 'ERROR|WARN|Exception' || echo '(ERROR/WARN 없음)' ;;
            startup)
              journalctl -u "$UNIT" -n "$LINES" --no-pager \
                | grep -E 'Starting|Started|profile|APPLICATION FAILED|Tomcat' || echo '(기동 로그 없음)' ;;
            recent)
              journalctl -u "$UNIT" -n "$LINES" --no-pager \
                | grep -v -E 'Authorization|Bearer |Cookie|JSESSIONID|GET /|POST /|PUT /|DELETE /' \
                || echo '(로그 없음)' ;;
            *) exit 2 ;;
          esac
          REMOTE_SCRIPT
          ) | tail -c 18000 | sed -E '
            s/eyJ[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]{6,}\.[A-Za-z0-9_-]+/<가림:JWT>/g;
            s/([Bb]earer|[Aa]uthorization:?)[[:space:]]+[A-Za-z0-9._~+\/-]{8,}/\1 <가림>/g;
            s/(JSESSIONID|SESSION|[Cc]ookie)=[^;[:space:]]+/\1=<가림>/g;
            s/AIza[A-Za-z0-9_-]{10,}/<가림:APIKEY>/g;
            s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<가림:이메일>/g'
