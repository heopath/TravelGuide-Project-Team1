name: Server Logs

# EC2에 직접 들어가지 않고 운영 로그를 보기 위한 워크플로.
# 배포는 SSH가 아니라 SSM으로 하므로 조회도 같은 경로를 쓴다.
#
# 실행할 명령을 입력으로 받지 않는다. 받으면 저장소에 쓰기 권한이 있는 사람이
# 운영 서버에서 아무 명령이나 돌릴 수 있게 된다. 미리 정한 조회만 고르게 한다.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "무엇을 볼지"
        required: true
        type: choice
        default: gemini
        options:
          - gemini        # AI 여행계획 생성 실패 원인 (#234)
          - error         # ERROR/WARN 전반
          - startup       # 기동 로그와 활성 프로필
          - env           # 환경 변수 "이름"과 설정 여부 (값은 가림)
          - recent        # 최근 로그 그대로
      lines:
        description: "몇 줄을 볼지"
        required: false
        type: choice
        default: "200"
        options: ["100", "200", "500", "1000"]

jobs:
  logs:
    name: Read logs through SSM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run diagnostic through SSM
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          LINES: ${{ inputs.lines }}
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.AWS_EC2_INSTANCE_ID }}"
          UNIT="all-my-trips"

          # 조회별 명령. TARGET은 choice라 아래 목록 밖의 값이 들어올 수 없다.
          case "$TARGET" in
            gemini)
              REMOTE="journalctl -u $UNIT -n $LINES --no-pager | grep -i -E 'gemini|여행 초안' || echo '(Gemini 관련 로그 없음)'" ;;
            error)
              REMOTE="journalctl -u $UNIT -n $LINES --no-pager | grep -E 'ERROR|WARN|Exception' || echo '(ERROR/WARN 없음)'" ;;
            startup)
              REMOTE="journalctl -u $UNIT -n $LINES --no-pager | grep -E 'Starting|Started|profile|APPLICATION FAILED|Tomcat' || echo '(기동 로그 없음)'" ;;
            env)
              # 값은 찍지 않는다. 워크플로 로그는 저장소를 읽을 수 있는 사람이 모두 본다.
              REMOTE="systemctl show $UNIT -p Environment | tr ' ' '\n' | sed -E 's/^(Environment=)?([A-Z_][A-Z0-9_]*)=.*/\2 = <설정됨>/' | grep -E '= <설정됨>' | sort || echo '(환경 변수 없음)'" ;;
            recent)
              REMOTE="journalctl -u $UNIT -n $LINES --no-pager" ;;
            *)
              echo "알 수 없는 조회: $TARGET"; exit 1 ;;
          esac

          jq -Rn --arg script "$REMOTE" '{commands: [$script]}' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Read $TARGET logs" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          set -e

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json)

          echo "상태: $(jq -r '.Status' <<< "$INVOCATION")"
          echo "----- 결과 ($TARGET, 최근 $LINES줄) -----"
          # 혹시 로그에 긴 토큰이 섞여 나와도 그대로 남기지 않는다.
          jq -r '.StandardOutputContent' <<< "$INVOCATION" \
            | sed -E 's/(AIza|sk-|key=)[A-Za-z0-9_-]{12,}/\1<가림>/g'

          REMOTE_ERR=$(jq -r '.StandardErrorContent' <<< "$INVOCATION")
          if [ -n "$REMOTE_ERR" ]; then
            echo "----- 원격 에러 -----"
            echo "$REMOTE_ERR"
          fi
