name: Build and Deploy All My Trips

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: all-my-trips-production
  cancel-in-progress: false

jobs:
  # 화면 수용 기준. 빌드와 나란히 돌리고, 배포는 둘 다 통과해야 시작합니다.
  # 이것이 없으면 화면이 깨져도 배포가 그대로 나갑니다 — gradlew build는 서버 테스트만
  # 돌립니다.
  frontend:
    name: 화면 수용 기준
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/test/js/package-lock.json

      - name: Install dependencies
        working-directory: src/test/js
        run: npm ci

      - name: Run acceptance tests
        working-directory: src/test/js
        run: npm test

  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew clean build --no-daemon

      - name: Prepare deployment JAR
        shell: bash
        run: |
          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-plain.jar" \
            -print \
            -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "배포할 JAR 파일을 찾지 못했습니다."
            exit 1
          fi

          mkdir -p deployment
          cp "$JAR_FILE" deployment/app.jar
          ls -lh deployment/app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-jar
          path: deployment/app.jar
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to Oracle Cloud
    needs: [build, frontend]
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v6

      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: spring-boot-jar
          path: deployment

      - name: Configure Oracle Cloud SSH
        shell: bash
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$OCI_SSH_PRIVATE_KEY"
          test -n "$OCI_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/oci_deploy_key"
          printf '%s\n' "$OCI_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/oci_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Upload release to Oracle Cloud
        shell: bash
        env:
          OCI_APP_HOST: ${{ vars.OCI_APP_HOST }}
          OCI_APP_USER: ${{ vars.OCI_APP_USER }}
        run: |
          set -euo pipefail
          test -n "$OCI_APP_HOST"
          test -n "$OCI_APP_USER"
          REMOTE_JAR="/tmp/all-my-trips-${GITHUB_SHA}.jar"
          REMOTE_SCRIPT="/tmp/deploy-all-my-trips-${GITHUB_SHA}.sh"
          SSH=(ssh -i "$HOME/.ssh/oci_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/oci_deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)

          "${SCP[@]}" deployment/app.jar \
            "${OCI_APP_USER}@${OCI_APP_HOST}:${REMOTE_JAR}"
          "${SCP[@]}" deploy/oci/deploy-github-actions.sh \
            "${OCI_APP_USER}@${OCI_APP_HOST}:${REMOTE_SCRIPT}"

          "${SSH[@]}" "${OCI_APP_USER}@${OCI_APP_HOST}" \
            "sudo bash '${REMOTE_SCRIPT}' '${REMOTE_JAR}' '${GITHUB_SHA}'"

      - name: Verify public site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            https://allmytrip.click/ > /dev/null
          echo "Oracle Cloud 배포와 공개 HTTPS 응답을 확인했습니다."
