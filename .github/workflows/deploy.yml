name: Build and Deploy All My Trips

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: all-my-trips-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew clean build --no-daemon

      - name: Prepare deployment JAR
        shell: bash
        run: |
          JAR_FILE=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-plain.jar" \
            -print \
            -quit)

          if [ -z "$JAR_FILE" ]; then
            echo "배포할 JAR 파일을 찾지 못했습니다."
            exit 1
          fi

          mkdir -p deployment
          cp "$JAR_FILE" deployment/app.jar
          ls -lh deployment/app.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: spring-boot-jar
          path: deployment/app.jar
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v7
        with:
          name: spring-boot-jar
          path: deployment

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "719152986655"
          role-session-name: all-my-trips-github-deploy

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Upload JAR to S3
        id: upload
        shell: bash
        run: |
          S3_KEY="releases/${GITHUB_SHA}.jar"
          S3_URI="s3://${{ vars.AWS_S3_BUCKET }}/${S3_KEY}"

          aws s3 cp deployment/app.jar "$S3_URI" \
            --only-show-errors

          echo "s3_uri=$S3_URI" >> "$GITHUB_OUTPUT"
          echo "업로드 완료: $S3_URI"

      - name: Deploy through SSM
        shell: bash
        run: |
          S3_URI="${{ steps.upload.outputs.s3_uri }}"
          INSTANCE_ID="${{ vars.AWS_EC2_INSTANCE_ID }}"

          # deploy.sh 출력을 그대로 흘리지 않고 원격에서 파일로 받은 뒤 뒷부분만 돌려준다.
          # SSM의 StandardOutputContent는 24KB에서 잘리는데, S3 다운로드 진행률이 그 한도를
          # 다 채워 정작 뒤에 찍히는 실패 원인이 날아갔다(#136). 앞이 아니라 뒤를 남겨야 한다.
          # 실패했을 때만 systemd 로그를 덧붙인다. 기동 실패는 deploy.sh 출력이 아니라
          # journalctl에만 남아서, 지금까지는 EC2에 직접 들어가야 원인을 알 수 있었다.
          cat > remote-deploy.sh <<REMOTE_SCRIPT
          LOG=\$(mktemp)
          /opt/all-my-trips/shared/deploy.sh ${S3_URI} > "\$LOG" 2>&1
          rc=\$?
          tail -n 200 "\$LOG" | tail -c 12000
          if [ "\$rc" -ne 0 ]; then
            echo
            echo "----- systemd 로그 (all-my-trips, 최근 50줄) -----"
            journalctl -u all-my-trips -n 50 --no-pager 2>&1 | tail -c 8000
          fi
          rm -f "\$LOG"
          exit "\$rc"
          REMOTE_SCRIPT

          # 따옴표가 많아 문자열로 조립하면 깨지기 쉽다. jq로 JSON을 만들어 파일로 넘긴다.
          jq -Rn --rawfile script remote-deploy.sh \
            '{commands: ($script | rtrimstr("\n") | split("\n"))}' > ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy All My Trips ${GITHUB_SHA}" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM 명령 ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_RESULT=$?
          set -e

          INVOCATION=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)

          # JSON 한 덩어리로 찍으면 줄바꿈이 \n으로 escape되어 로그에서 읽을 수 없다.
          echo "상태: $(jq -r '.Status' <<< "$INVOCATION")"
          echo "----- 원격 출력 -----"
          jq -r '.StandardOutputContent' <<< "$INVOCATION"

          REMOTE_ERR=$(jq -r '.StandardErrorContent' <<< "$INVOCATION")
          if [ -n "$REMOTE_ERR" ]; then
            echo "----- 원격 에러 -----"
            echo "$REMOTE_ERR"
          fi

          exit "$WAIT_RESULT"
