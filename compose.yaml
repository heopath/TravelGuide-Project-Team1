services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: all_my_trips
      POSTGRES_USER: allmytrips
      POSTGRES_PASSWORD: local-secret
      TZ: Asia/Seoul
    labels:
      org.springframework.boot.service-connection: postgres
    ports:
      - "5432:5432"
    volumes:
      - all-my-trips-postgres:/var/lib/postgresql/data
      - ./database/init/create_extensions.sql:/docker-entrypoint-initdb.d/01_create_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allmytrips -d all_my_trips"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  all-my-trips-postgres:
