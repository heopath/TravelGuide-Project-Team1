spring.application.name=All_My_Trip_Project

# 캐리어별 예약 페이지 URL 패턴. 항공사가 주소를 바꿔도 코드 수정 없이 갱신할 수 있게 분리했다.
spring.config.import=classpath:deeplink-templates.yml

# 외부 API 키는 저장소에 커밋하지 않고 환경변수로 주입한다.
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.local.timeout-millis=5000
kakao.local.total-search-timeout-millis=7000
weather.service-key=${KMA_WEATHER_SERVICE_KEY:}

# 완료 여행 사진첩 이미지. 운영은 IAM Role, 로컬은 AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY로
# AWS SDK 기본 자격 증명을 사용한다. 버킷을 public으로 열지 않고 API가 공개 범위와 소유권을 확인해 전달한다.
travel-record.s3.enabled=${TRAVEL_RECORD_S3_ENABLED:false}
travel-record.s3.bucket=${AWS_S3_BUCKET:}
travel-record.s3.region=${AWS_REGION:ap-northeast-2}
travel-record.s3.prefix=${TRAVEL_RECORD_S3_PREFIX:travel-records}
travel-record.s3.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 관리자 화면에서 저장하는 API 키를 봉인할 마스터 키(Base64 32바이트).
#   openssl rand -base64 32
# 이 값이 비어 있으면 관리자 화면은 조회만 되고 저장은 거절한다. 평문 저장 대안은 두지 않는다.
# 값을 바꾸면 이미 저장된 키는 열 수 없다. 그때는 환경변수 값으로 되돌아간다.
security.api-key-encryption-key=${API_KEY_ENCRYPTION_KEY:}

# 화면 연결 작업 단계에서는 외부 DB와 AI 키 없이 실행할 수 있는 UI 프로필을 기본값으로 사용한다.
# 백엔드 연결 후에는 local/dev/prod 프로필을 만들고 이 기본 프로필을 변경한다.
spring.profiles.default=ui

# TAGO 국내항공운항정보. 포털이 주는 인코딩 키를 그대로 넣는다(디코딩 키 아님).
# 비어 있으면 provider가 비활성화되고 Mock이 폴백을 맡는다.
tago.service-key=${TAGO_SERVICE_KEY:}

# 한국관광공사 국문 관광정보 서비스. 숙소명·주소·사진·좌표를 제공하며 요금은 제공하지 않는다.
# 비어 있으면 provider가 비활성화되고 개발 환경에서는 Mock 목록을 사용한다.
tour-api.service-key=${TOUR_API_SERVICE_KEY:}

# LiteAPI 서버용 Sandbox Key(sand_ 또는 sandbox_). 공개키(pk_test_)는 사용하지 않는다.
# prod 프로필에서는 키가 설정돼 있어도 provider가 호출되지 않는다.
liteapi.sandbox.api-key=${LITEAPI_SANDBOX_API_KEY:}

# Travelpayouts(Aviasales) Flight Data API. 비어 있으면 전부 공시운임으로 간다.
# 캐시 기반이라 커버리지가 낮다. 임계값 미만이면 가격을 덮어쓰지 않고 딥링크만 쓴다.
travelpayouts.token=${TRAVELPAYOUTS_TOKEN:}
travelpayouts.marker=${TRAVELPAYOUTS_MARKER:}

# 티켓 시간대별 예약 대기열. 평상시에는 바로 통과하고 이 처리량을 넘는 순간에만 대기시킨다.
booking.queue.capacity-per-second=${BOOKING_QUEUE_CAPACITY_PER_SECOND:5}
booking.queue.entry-ttl=${BOOKING_QUEUE_ENTRY_TTL:10m}
booking.queue.admission-ttl=${BOOKING_QUEUE_ADMISSION_TTL:2m}
booking.queue.processing-ttl=${BOOKING_QUEUE_PROCESSING_TTL:30s}
booking.queue.completed-ttl=${BOOKING_QUEUE_COMPLETED_TTL:2m}

# 토스페이먼츠. 유일하게 실제 결제사를 거치는 결제수단이다. (#281)
# 클라이언트 키는 브라우저에 드러나는 공개 키라 화면(meta 태그)에 실린다.
# 시크릿 키는 승인에만 쓰이고 서버 밖으로 나가지 않는다 — 저장소에 넣지 않는다.
# 둘 다 비어 있으면 결제수단 목록에서 토스가 빠지고 모의 결제만 남는다.
payment.toss.client-key=${PAYMENT_TOSS_CLIENT_KEY:}
payment.toss.secret-key=${PAYMENT_TOSS_SECRET_KEY:}

# 카카오페이 온라인 결제. 화면이 쓸 공개 키가 없다 — 결제 시작부터 서버가 부른다.
# 시크릿 키가 비어 있으면 결제수단 목록에서 카카오페이(실결제)가 빠진다.
# 테스트 가맹점 코드(TC0ONETIME)는 공개값이라 그대로 둔다.
# base-url은 카카오가 손님을 돌려보낼 우리 주소다. 배포 도메인과 같아야 한다.
#
# 이 주소의 도메인을 카카오페이 개발자센터에도 등록해야 한다
# (developers.kakaopay.com > 애플리케이션 > 플랫폼). 카카오 로그인 쪽
# 콘솔(developers.kakao.com)이 아니라 결제 전용 콘솔이다.
# 등록하지 않으면 결제 시작이 400으로 막힌다 — 키가 맞아도 도메인 검증에서 걸린다.
payment.kakao.secret-key=${PAYMENT_KAKAO_SECRET_KEY:}
payment.kakao.cid=${PAYMENT_KAKAO_CID:TC0ONETIME}
payment.kakao.base-url=${PAYMENT_KAKAO_BASE_URL:http://localhost:8080}

# 메일에 실릴 재설정 링크의 앞부분. 배포 도메인과 같아야 손님이 링크를 눌러 돌아온다.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# 비밀번호 재설정 메일(SMTP).
# spring.mail.host는 여기에 두지 않는다 — 빈 값이라도 적으면 스프링이 JavaMailSender를
# 만들어 버려서, 설정이 없을 때 로그로 링크를 남기는 길이 막힌다. 보내려면 환경변수
# SPRING_MAIL_HOST·SPRING_MAIL_USERNAME·SPRING_MAIL_PASSWORD 셋을 넣는다.
# (Gmail은 host=smtp.gmail.com, password는 계정 비밀번호가 아니라 앱 비밀번호다.)
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
