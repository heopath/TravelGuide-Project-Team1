spring.application.name=All_My_Trip_Project

# 캐리어별 예약 페이지 URL 패턴. 항공사가 주소를 바꿔도 코드 수정 없이 갱신할 수 있게 분리했다.
spring.config.import=classpath:deeplink-templates.yml

# 외부 API 키는 저장소에 커밋하지 않고 환경변수로 주입한다.
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY:}
kakao.mobility.rest-api-key=${KAKAO_MOBILITY_REST_API_KEY:}
weather.service-key=${KMA_WEATHER_SERVICE_KEY:}

# 화면 연결 작업 단계에서는 외부 DB와 AI 키 없이 실행할 수 있는 UI 프로필을 기본값으로 사용한다.
# 백엔드 연결 후에는 local/dev/prod 프로필을 만들고 이 기본 프로필을 변경한다.
spring.profiles.default=ui

# TAGO 국내항공운항정보. 포털이 주는 인코딩 키를 그대로 넣는다(디코딩 키 아님).
# 비어 있으면 provider가 비활성화되고 Mock이 폴백을 맡는다.
tago.service-key=${TAGO_SERVICE_KEY:}

# Travelpayouts(Aviasales) Flight Data API. 비어 있으면 전부 공시운임으로 간다.
# 캐시 기반이라 커버리지가 낮다. 임계값 미만이면 가격을 덮어쓰지 않고 딥링크만 쓴다.
travelpayouts.token=${TRAVELPAYOUTS_TOKEN:}
travelpayouts.marker=${TRAVELPAYOUTS_MARKER:}
