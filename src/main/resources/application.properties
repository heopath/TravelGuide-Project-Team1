spring.application.name=All_My_Trip_Project

# 캐리어별 예약 페이지 URL 패턴. 항공사가 주소를 바꿔도 코드 수정 없이 갱신할 수 있게 분리했다.
spring.config.import=classpath:deeplink-templates.yml

# 외부 API 키는 저장소에 커밋하지 않고 환경변수로 주입한다.
kakao.maps.javascript-key=${KAKAO_MAPS_JAVASCRIPT_KEY:}
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.local.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.local.timeout-millis=5000
kakao.local.total-search-timeout-millis=7000
weather.service-key=${KMA_WEATHER_SERVICE_KEY:}

# 화면 연결 작업 단계에서는 외부 DB와 AI 키 없이 실행할 수 있는 UI 프로필을 기본값으로 사용한다.
# 백엔드 연결 후에는 local/dev/prod 프로필을 만들고 이 기본 프로필을 변경한다.
spring.profiles.default=ui

# TAGO 국내항공운항정보. 포털이 주는 인코딩 키를 그대로 넣는다(디코딩 키 아님).
# 비어 있으면 provider가 비활성화되고 Mock이 폴백을 맡는다.
tago.service-key=${TAGO_SERVICE_KEY:}

# 한국관광공사 국문 관광정보 서비스. 숙소명·주소·사진·좌표를 제공하며 요금은 제공하지 않는다.
# 비어 있으면 provider가 비활성화되고 개발 환경에서는 Mock 목록을 사용한다.
tour-api.service-key=${TOUR_API_SERVICE_KEY:}

# LiteAPI 서버용 Sandbox Key(sand_ 또는 sandbox_). 공개키(pk_test_)는 사용하지 않는다.
# prod 프로필에서는 키가 설정돼 있어도 provider가 호출되지 않는다.
liteapi.sandbox.api-key=${LITEAPI_SANDBOX_API_KEY:}

# Travelpayouts(Aviasales) Flight Data API. 비어 있으면 전부 공시운임으로 간다.
# 캐시 기반이라 커버리지가 낮다. 임계값 미만이면 가격을 덮어쓰지 않고 딥링크만 쓴다.
travelpayouts.token=${TRAVELPAYOUTS_TOKEN:}
travelpayouts.marker=${TRAVELPAYOUTS_MARKER:}

# 티켓 시간대별 예약 대기열. 평상시에는 바로 통과하고 이 처리량을 넘는 순간에만 대기시킨다.
booking.queue.capacity-per-second=${BOOKING_QUEUE_CAPACITY_PER_SECOND:5}
booking.queue.entry-ttl=${BOOKING_QUEUE_ENTRY_TTL:10m}
booking.queue.admission-ttl=${BOOKING_QUEUE_ADMISSION_TTL:2m}
booking.queue.processing-ttl=${BOOKING_QUEUE_PROCESSING_TTL:30s}
booking.queue.completed-ttl=${BOOKING_QUEUE_COMPLETED_TTL:2m}
