# Local Gemini verification profile: keep local database, Redis, Flyway and embedding services disabled.
# Do not exclude GoogleGenAiChatAutoConfiguration; the ai profile needs it to create ChatModel.
spring.docker.compose.enabled=false
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.thymeleaf.cache=false
# This profile exists only for the isolated AI guide screen. Other features need the local DB profile.
spring.main.lazy-initialization=true
