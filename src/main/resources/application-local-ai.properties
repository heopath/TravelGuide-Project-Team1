# 로컬 RAG 검증 전용 보조 프로필이다.
# 실행 프로필은 local,ai,local-ai로 함께 지정한다.
# 예: --spring.profiles.active=local,ai,local-ai
#
# application-local.properties는 일반 로컬 실행에서 pgvector를 비활성화한다.
# local-ai 조합에서는 VectorStore가 필요하므로 해당 제외 설정을 명시적으로 비운다.
spring.autoconfigure.exclude=

# AI 가이드는 OpenAI API를 사용한다. OpenAiEmbeddingModel이 Embeddings API를 직접 호출한다.
# API 키는 application-ai.properties의 OPENAI_API_KEY 환경 변수로만 주입한다.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.embedding.dimensions=1536
openai.embedding.timeout-millis=25000

# OpenAI embedding 차원과 vector_store의 vector 차원은 반드시 같아야 한다.
# 로컬 개발 DB에서는 스키마 자동 생성을 허용한다. DB에 vector 확장이 먼저 설치되어 있어야 한다.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=96
