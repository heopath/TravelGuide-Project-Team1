# 로컬 RAG 검증 전용 보조 프로필이다.
# 실행 프로필은 local,ai,local-ai로 함께 지정한다.
# 예: --spring.profiles.active=local,ai,local-ai
#
# AI 가이드는 Cohere API를 사용한다. Spring AI 2.0은 Cohere Developer API용
# EmbeddingModel 자동 설정을 제공하지 않으므로, CohereEmbeddingModel이 /v2/embed를 직접 호출한다.
# API 키는 application-ai.properties의 COHERE_API_KEY 환경 변수로만 주입한다.
# PGVectorStore는 활성화하되, 사용하지 않는 Google GenAI 임베딩 자동 설정은 제외한다.
spring.autoconfigure.exclude=\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration

# Gemini 자동 설정은 사용하지 않는다. CohereEmbeddingModel이 Spring AI EmbeddingModel 빈을 제공한다.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none
cohere.embedding.model=embed-v4.0
cohere.embedding.dimensions=1536
cohere.embedding.timeout-millis=25000

# Cohere embedding 차원과 vector_store의 vector 차원은 반드시 같아야 한다.
# 로컬 개발 DB에서는 스키마 자동 생성을 허용한다. DB에 vector 확장이 먼저 설치되어 있어야 한다.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=96
