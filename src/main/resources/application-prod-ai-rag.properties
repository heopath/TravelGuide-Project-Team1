# 운영 RAG는 prod,ai,prod-ai-rag 조합에서만 명시적으로 활성화한다.
# V10__vector_store.sql이 먼저 적용되어 있어야 하며, 운영에서 자동 스키마
# 생성을 켜면 저장소에 기록되지 않은 테이블이 만들어질 수 있으므로 금지한다.
spring.autoconfigure.exclude=
spring.ai.model.chat=none
spring.ai.model.embedding.text=none

cohere.embedding.model=embed-v4.0
cohere.embedding.dimensions=1536
cohere.embedding.timeout-millis=25000

spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.max-document-batch-size=96

# 운영 재색인은 배포 시 자동 실행하지 않는다. 별도 관리자 작업으로만 실행한다.
ai.rag.reindex-on-startup=false
