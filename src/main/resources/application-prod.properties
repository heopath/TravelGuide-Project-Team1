spring.docker.compose.enabled=false

spring.autoconfigure.exclude=\
org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# PostgreSQL RDS
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# MyBatis
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=org.example.all_my_trip_project.domain
mybatis.configuration.map-underscore-to-camel-case=true

spring.ai.model.embedding.text=none

# Nginx·Cloudflare 전달 헤더
server.forward-headers-strategy=framework

# HTTPS 세션 쿠키
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# 운영 환경에서는 Thymeleaf 캐시 사용
spring.thymeleaf.cache=true

# JAR 릴리스 디렉터리가 바뀌어도 사용자 사진은 유지한다.
travel.record.image-directory=${TRAVEL_RECORD_IMAGE_DIRECTORY:/opt/all-my-trips/shared/uploads/travel-record-images}

# 정적 파일은 브라우저에서 1시간, Cloudflare 같은 공유 캐시에서 1일 보관한다.
# Cache Rule은 이 원본 헤더를 존중하므로 HTML/API 응답은 캐시되지 않는다.
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.s-max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.stale-while-revalidate=1d

# Cloudflare Turnstile: 키를 모두 넣은 뒤 enabled만 true로 바꾼다.
cloudflare.turnstile.enabled=${CLOUDFLARE_TURNSTILE_ENABLED:false}
cloudflare.turnstile.site-key=${CLOUDFLARE_TURNSTILE_SITE_KEY:}
cloudflare.turnstile.secret-key=${CLOUDFLARE_TURNSTILE_SECRET_KEY:}
cloudflare.turnstile.expected-hostname=${CLOUDFLARE_TURNSTILE_EXPECTED_HOSTNAME:www.allmytrip.click}
cloudflare.turnstile.timeout=3s

# Redis 장소 상세 캐시
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=all-my-trips:
spring.cache.redis.use-key-prefix=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.database=${SPRING_DATA_REDIS_DATABASE:0}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
