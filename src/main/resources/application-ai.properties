# AI(Gemini) 전용 프로필. 단독으로 쓰지 않고 실행 환경 프로필 위에 덧씌운다.
#
#   ui,ai      DB 없이 AI 가이드 화면만 확인
#   local,ai   로컬 PostgreSQL·Redis와 함께 전체 기능 확인
#   prod,ai    운영
#
# spring.autoconfigure.exclude를 여기서 설정하지 않는 것이 중요하다.
# 이 속성은 프로필 간에 병합되지 않고 통째로 덮어쓰기 때문에, 값을 지정하면
# 앞선 ui/local 프로필의 DB·Redis 제외 목록이 사라진다.
#
# GEMINI_API_KEY는 환경 변수로만 주입한다. 값을 파일에 적거나 커밋하지 않는다.
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.2

ai.guide.mock.enabled=false
ai.guide.gemini.http-timeout-millis=25000
