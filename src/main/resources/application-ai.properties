# GEMINI_API_KEY is supplied only through the local or deployment environment.
# Never place the key value in a properties file or commit it to Git.
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.2

ai.guide.mock.enabled=false
ai.guide.gemini.timeout-seconds=30
