# UI 검수 전용 프로필: DB, Redis, Flyway, AI 자동 구성을 백엔드 연결 전까지 비활성화한다.
#
# GoogleGenAiChatAutoConfiguration은 제외 목록에 넣지 않는다.
# ai 프로필을 덧씌운 `ui,ai` 조합에서 Gemini를 켤 수 있어야 하기 때문이며,
# ui 단독 실행에서는 아래 spring.ai.model.chat=none 만으로 ChatModel이 생성되지 않는다.
spring.docker.compose.enabled=false
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration,\
org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.ai.model.chat=none
spring.ai.model.embedding.text=none
spring.thymeleaf.cache=false
ai.guide.mock.enabled=true

# 이 프로필은 Redis 자동 구성을 통째로 뺀다. 세션 저장소도 Redis를 보지 않게 꺼서
# 화면 검수용 실행이 Redis 없이도 뜨도록 한다.
spring.session.store-type=none
