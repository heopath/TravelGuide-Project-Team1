<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 마이 페이지" />
    <title>마이 페이지 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/mypage/mypage.css}" href="../../static/css/pages/mypage/mypage.css" />
  </head>
  <body class="page-mypage" data-route="/mypage">
    <div class="app">
      <div th:replace="~{fragments/header :: header('mypage')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1>마이 페이지</h1>
        <p>나의 정보와 여행 취향을 관리하세요.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="profile-overview">
        <section class="white-panel profile-card" aria-busy="true" data-profile-card>
          <div class="profile-avatar" data-profile-avatar>…</div>
          <div class="profile-details">
            <h2><span data-profile-nickname>회원정보를 불러오는 중</span> 님</h2>
            <p data-profile-email>잠시만 기다려 주세요.</p>
            <button class="outline-button" type="button" data-profile-edit>프로필 관리</button>
            <form class="profile-edit-form" data-profile-form hidden>
              <label for="mypage-nickname">닉네임</label>
              <div class="profile-edit-row">
                <input id="mypage-nickname" name="nickname" type="text" minlength="2" maxlength="20" required />
                <button class="primary-button" type="submit">저장</button>
                <button class="outline-button" type="button" data-profile-cancel>취소</button>
              </div>
              <p class="profile-form-error" data-profile-error role="alert"></p>
            </form>
          </div>
        </section>
        <div class="metric-card metric-0"><span>예약 내역</span><strong>준비 중</strong></div>
         <div class="metric-card metric-1"><span>찜한 여행지</span><strong data-favorite-count>—</strong></div>
        <div class="metric-card metric-2"><span>여행 일정</span><strong>준비 중</strong></div>
        <div class="metric-card metric-3"><span>포인트</span><strong>준비 중</strong></div>
       </div>
       <section class="white-panel favorite-places" aria-labelledby="favorite-places-title">
         <div class="favorite-places-heading">
           <div>
             <span>MY FAVORITES</span>
             <h2 id="favorite-places-title">찜한 여행지</h2>
           </div>
           <button type="button" class="outline-button" data-route="/guide">여행지 더 찾아보기</button>
         </div>
         <div class="favorite-place-list" data-favorite-list aria-live="polite">
           <p class="favorite-place-state">찜한 여행지를 불러오는 중입니다.</p>
         </div>
       </section>
       <div class="mypage-grid">
        <section class="white-panel preference-card">
          <div class="mypage-section-heading">
            <div>
              <h2>나의 여행 취향</h2>
              <p>추천과 AI 일정 생성에 활용되는 장기 여행 선호입니다.</p>
            </div>
          </div>
          <div class="preference-list" data-preference-list aria-live="polite">
            <span class="preference-empty">여행 선호를 불러오는 중입니다.</span>
          </div>
        </section>
        <section class="white-panel account-bookings">
          <h2>예약 내역</h2>
          <p class="mypage-placeholder">예약 기능 담당 API가 준비되면 이 영역에 실제 예약 내역이 표시됩니다.</p>
        </section>
        <aside class="white-panel account-menu">
          <h2>내 정보</h2>
          <button type="button" data-profile-edit-menu>회원정보 수정<span>›</span></button>
          <button type="button" disabled>결제 수단 관리<span>준비 중</span></button>
          <button type="button" disabled>알림 설정<span>준비 중</span></button>
          <button type="button" disabled>고객센터<span>준비 중</span></button>
        </aside>
       </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/mypage/mypage.js}" src="../../static/js/pages/mypage/mypage.js"></script>
  </body>
</html>
