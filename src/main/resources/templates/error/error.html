<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title th:text="${status == 404 ? '길을 찾을 수 없어요' : '잠시 경로를 잃었어요'} + ' — All My Trips'">오류 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/pages/error/error.css}" href="/css/pages/error/error.css" />
  </head>
  <body>
    <main class="error-page">
      <section class="error-card" aria-labelledby="error-title">
        <a class="error-brand" th:href="@{/home}" href="/home">
          <img th:src="@{/images/icons/app-icon.png}" src="/images/icons/app-icon.png" alt="" />
          <span>All My Trips</span>
        </a>
        <div class="error-visual" aria-hidden="true">
          <strong class="error-code" th:text="${status ?: 500}">500</strong>
          <div class="error-route"></div>
          <div class="error-pin"><span>●</span></div>
          <div class="error-plane">✈</div>
        </div>
        <p class="error-kicker" th:text="${status == 404 ? 'ROUTE NOT FOUND' : 'TEMPORARY DELAY'}">TEMPORARY DELAY</p>
        <h1 id="error-title" th:text="${status == 404 ? '앗, 여행 경로를 찾을 수 없어요' : '잠시 경로를 잃었어요'}">잠시 경로를 잃었어요</h1>
        <p class="error-description"
           th:text="${status == 404 ? '입력한 주소가 바뀌었거나 사라진 것 같아요. 홈으로 돌아가 새로운 여행을 시작해 보세요.' : '예상치 못한 문제가 발생했어요. 잠시 후 다시 시도하면 여행을 계속할 수 있어요.'}">
          예상치 못한 문제가 발생했어요. 잠시 후 다시 시도해 주세요.
        </p>
        <div class="error-actions">
          <a class="home-link" th:href="@{/home}" href="/home">홈으로 돌아가기</a>
          <a class="back-link" href="javascript:history.back()">이전 페이지</a>
        </div>
        <p class="error-help">문제가 계속되면 잠시 후 다시 접속해 주세요.</p>
      </section>
    </main>
  </body>
</html>
