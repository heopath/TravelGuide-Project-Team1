<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 예약 허브" />
    <title>예약 허브 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/booking/booking.css}" href="../../static/css/pages/booking/booking.css" />
  </head>
  <body class="page-booking" data-route="/booking">
    <div class="app">
      <div th:replace="~{fragments/header :: header('booking')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>04 </span>여행 예약</h1>
        <p>일정에 필요한 항공·숙박·티켓을 한 번에 준비하세요.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="booking-type-grid"><article><span>✈</span><h2>항공</h2><p>최적 항공편 비교</p><button class="primary-button wide" data-route="/booking/flights">검색하기</button></article><article><span>▣</span><h2>숙소</h2><p>호텔과 객실 검색</p><button class="outline-button wide" data-route="/booking/hotels">검색하기</button></article><article><span>★</span><h2>티켓·액티비티</h2><p>관광지와 체험 예약</p><button class="outline-button wide" data-route="/booking/tickets/blueline">검색하기</button></article></div>
      <section class="white-panel booking-recommendations"><h2>AI 추천 일정에 필요한 예약</h2><button data-route="/booking/flights"><span>✈</span><strong>인천 → 제주 항공</strong><b>최저 89,000원</b><em>예약 →</em></button><button data-route="/booking/hotels"><span>▣</span><strong>제주 오션뷰 호텔</strong><b>1박 145,000원</b><em>예약 →</em></button><button data-route="/booking/tickets/blueline"><span>★</span><strong>성산일출봉 투어</strong><b>1인 28,000원</b><em>예약 →</em></button></section>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
