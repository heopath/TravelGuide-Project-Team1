<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 티켓 상세·예약" />
    <title>티켓 상세·예약 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/booking/ticket.css}" href="../../static/css/pages/booking/ticket.css" />
  </head>
  <body class="page-ticket" data-route="/booking/tickets/blueline">
    <div class="app">
      <div th:replace="~{fragments/header :: header('booking')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>04 </span>해운대 블루라인파크</h1>
        <p>스카이캡슐과 해변열차를 한 번에 예약하세요.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="ticket-layout"><div><div class="detail-hero tone-blue"><span>BEACH TRAIN · SKY CAPSULE</span></div><section class="white-panel ticket-options"><h2>티켓 옵션</h2><label><input type="radio" name="ticket" /><strong>해변열차 1회권</strong><span>16,000원</span></label><label><input type="radio" name="ticket" checked/><strong>스카이캡슐 편도</strong><span>48,000원</span></label><label><input type="radio" name="ticket" /><strong>패키지 이용권</strong><span>62,000원</span></label></section></div><aside class="white-panel purchase-panel"><span>예약 요약</span><h2>스카이캡슐 편도</h2><p>2026.08.15 · 16:30</p><p>성인 2명</p><hr/><strong>총 96,000원</strong><button type="button" class="primary-button wide" data-modal="payment">옵션·결제 계속</button></aside></div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
