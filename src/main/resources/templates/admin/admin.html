<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 관리자 대시보드" />
    <title>관리자 대시보드 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/admin/admin.css}" href="../../static/css/pages/admin/admin.css" />
  </head>
  <body class="page-admin" data-route="/admin">
    <div class="app">
      <div th:replace="~{fragments/header :: header('admin')}"></div>
      <main id="page-content">
        <section class="page-shell">
    <section class="page-heading">
      <div>
        <h1>관리자 운영 대시보드</h1>
        <p>여행 테마와 예약 상품, 인기 데이터를 관리합니다.</p>
        <i>✦</i>
      </div>
      
    </section>
  <div class="admin-metrics"><div class="metric-card metric-0"><span>오늘 예약</span><strong>1,284건</strong></div><div class="metric-card metric-1"><span>대기 사용자</span><strong>328명</strong></div><div class="metric-card metric-2"><span>티켓 재고 경고</span><strong>6건</strong></div><div class="metric-card metric-3"><span>API 오류율</span><strong>0.18%</strong></div></div><div class="admin-grid"><section class="white-panel product-table"><h2>예약 상품 관리</h2><div><strong>성산일출봉 투어</strong><span class="">재고 12</span><em>판매중</em><button type="button" data-modal="admin-product">수정</button></div><div><strong>에버랜드 종일권</strong><span class="warn">재고 2</span><em>판매중</em><button type="button" data-modal="admin-product">수정</button></div><div><strong>부산 요트 투어</strong><span class="">재고 38</span><em>판매중</em><button type="button" data-modal="admin-product">수정</button></div><div><strong>빛의 벙커 전시</strong><span class="warn">재고 0</span><em>품절</em><button type="button" data-modal="admin-product">수정</button></div></section><form class="white-panel theme-form" data-demo-form><h2>테마 여행 등록</h2><label class="field"><span>테마명</span><input /></label><label class="field"><span>대표 지역</span><input /></label><label class="field"><span>예산 범위</span><input /></label><label class="field"><span>추천 태그</span><input /></label><button class="primary-button wide">테마 등록</button></form></div></section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
