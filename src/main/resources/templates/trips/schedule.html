<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 일정 편집" />
    <title>여행 일정 편집 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/schedule.css}" href="/css/pages/trips/schedule.css" />
  </head>
  <body class="page-schedule" data-route="/trips/busan/schedule">
    <div class="app">
      <div th:replace="~{fragments/header :: header('schedule')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>02 </span>여행 일정</h1>
        <p>날짜별 일정을 만들고 순서를 자유롭게 바꿔보세요.</p>
        <i>✦</i>
      </div>
      <div class="heading-actions"><button class="outline-button" data-modal="share">공유하기</button><button class="primary-button" data-modal="add-place">+ 일정 추가</button></div>
    </section>
  
      <div class="schedule-layout">
        <aside class="white-panel trip-sidebar"><h2>나의 여행</h2><button class="selected"><strong>부산 미식 여행</strong><span>08.14–08.17</span></button><button class=""><strong>제주 가족 여행</strong><span>09.05–09.08</span></button><button class=""><strong>도쿄 쇼핑 여행</strong><span>10.02–10.05</span></button><button class="outline-button wide" data-modal="new-trip">+ 새 여행 만들기</button></aside>
        <section class="white-panel schedule-main"><h2>부산 미식 여행</h2><div class="day-tabs"><button class="selected" data-toggle-group>DAY 1</button><button class="" data-toggle-group>DAY 2</button><button class="" data-toggle-group>DAY 3</button><button class="" data-toggle-group>DAY 4</button></div>
    <div class="timeline">
      
        <button type="button" data-toast="부산역 도착 일정을 선택했습니다.">
          <span>1</span><div><strong>부산역 도착</strong><small>10:20 · KTX 101</small></div>
        </button>
      
        <button type="button" data-toast="감천문화마을 일정을 선택했습니다.">
          <span>2</span><div><strong>감천문화마을</strong><small>11:30 · 2시간</small></div>
        </button>
      
        <button type="button" data-toast="자갈치시장 일정을 선택했습니다.">
          <span>3</span><div><strong>자갈치시장</strong><small>14:00 · 점심</small></div>
        </button>
      
        <button type="button" data-toast="광안리 해변 일정을 선택했습니다.">
          <span>4</span><div><strong>광안리 해변</strong><small>18:30 · 야경</small></div>
        </button>
      
    </div>
  </section>
        <aside class="schedule-side"><section class="white-panel"><h2>경로 미리보기</h2>
    <div class="mini-map ">
      <i class="road road-a"></i><i class="road road-b"></i><i class="road road-c"></i>
      <b class="pin pin-1">1</b><b class="pin pin-2">2</b><b class="pin pin-3">3</b><b class="pin pin-4">4</b>
    </div>
  <button class="center-link" data-route="/trips/busan/map">큰 지도에서 보기</button></section><section class="white-panel memo-card"><h2>여행 메모</h2><p>회센터는 현지 추천 확인</p><p>광안대교 점등 20:00</p><p>우천 시 실내 일정 적용</p></section></aside>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <script th:src="@{/js/common/api.js}" src="/js/common/api.js" defer></script>
    <script th:src="@{/js/common/navigation.js}" src="/js/common/navigation.js" defer></script>
    <script th:src="@{/js/common/modal.js}" src="/js/common/modal.js" defer></script>
    <script th:src="@{/js/pages/trips/schedule.js}" src="/js/pages/trips/schedule.js" defer></script>
  </body>
</html>
