<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 일정 편집" />
    <title>여행 일정 편집 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/schedule.css}" href="../../static/css/pages/trips/schedule.css" />
  </head>
  <body class="page-schedule" th:attr="data-trip-id=${tripId}" data-trip-id="">
    <div class="app">
      <div th:replace="~{fragments/header :: header('schedule')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>02 </span>여행 일정</h1>
        <p>날짜별 일정을 만들고 순서를 자유롭게 바꿔보세요.</p>
        <i>✦</i>
      </div>
      <div class="heading-actions"><button type="button" class="outline-button" data-modal="share">공유하기</button><button type="button" class="primary-button" data-schedule-guide>+ 장소 찾아보기</button></div>
    </section>
  
      <div class="schedule-layout">
        <aside class="white-panel trip-sidebar"><h2>나의 여행</h2><div data-trip-list><p class="schedule-empty">여행을 불러오는 중입니다.</p></div><button type="button" class="outline-button wide" data-route="/trips/new/basic">+ 새 여행 만들기</button></aside>
        <section class="white-panel schedule-main"><h2 data-schedule-title>여행 일정</h2><div class="day-tabs" data-day-tabs></div>
    <div class="timeline" data-timeline><p class="schedule-empty">일정을 불러오는 중입니다.</p></div>
  </section>
        <aside class="schedule-side"><section class="white-panel"><h2>경로 미리보기</h2>
    <div class="mini-map ">
      <i class="road road-a"></i><i class="road road-b"></i><i class="road road-c"></i>
      <b class="pin pin-1">1</b><b class="pin pin-2">2</b><b class="pin pin-3">3</b><b class="pin pin-4">4</b>
    </div>
  <button class="center-link" type="button" data-schedule-guide>여행 가이드에서 장소 찾기</button></section><section class="white-panel memo-card"><h2>여행 정보</h2><p data-schedule-period>기간을 불러오는 중입니다.</p><p data-schedule-destination>목적지를 불러오는 중입니다.</p><p>장소 상세 페이지에서 원하는 DAY에 일정을 추가할 수 있습니다.</p></section></aside>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/trips/schedule.js}" src="../../static/js/pages/trips/schedule.js"></script>
  </body>
</html>
