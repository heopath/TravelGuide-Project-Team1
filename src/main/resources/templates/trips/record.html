<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 기록" />
    <title>여행 기록 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/record.css}" href="../../static/css/pages/trips/record.css" />
  </head>
  <body class="page-record" data-route="/trips/busan/record">
    <div class="app">
      <div th:replace="~{fragments/header :: header('mypage')}"></div>
      <main id="page-content">
        <section class="page-shell">
    <section class="page-heading">
      <div>
        <h1><span>05 </span>부산 여행 기록</h1>
        <p>사진과 메모를 남기면 다음 추천에 취향으로 반영됩니다.</p>
        <i>✦</i>
      </div>
      
    </section>
  <div class="record-layout"><section class="white-panel"><div class="record-grid"><div class="tone-blue featured"></div><div class="tone-sunset"></div><div class="tone-mint"></div><button type="button" data-modal="upload">+ 사진 추가</button></div><label class="record-note"><span>여행 메모</span><textarea>광안리 야경과 감천문화마을 골목이 가장 기억에 남았다. 다음에는 해운대에서 하루 더 머물고 싶다.</textarea></label></section><aside class="white-panel record-summary"><span>2026.08.14–08.17</span><h2>부산 미식 여행</h2><p>4일 · 방문 장소 12곳 · 사진 24장</p><div>★★★★★</div><button class="primary-button wide" data-toast="여행 기록을 저장했습니다.">기록 저장</button></aside></div></section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
