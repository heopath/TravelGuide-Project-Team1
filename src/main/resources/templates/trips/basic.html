<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 기본 정보" />
    <title>여행 기본 정보 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/basic.css}" href="../../static/css/pages/trips/basic.css" />
  </head>
  <body class="page-basic" data-route="/trips/new/basic">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell">
          <section class="page-heading">
            <div>
              <h1><span>01 </span>여행 계획</h1>
              <p>몇 가지 정보만 알려주면 딱 맞는 여행을 제안할게요.</p>
              <i>✦</i>
            </div>
            <ol class="wizard">
              <li class="active"><span>1</span><b>기본 정보</b><i></i></li>
              <li><span>2</span><b>여행 스타일</b><i></i></li>
              <li><span>3</span><b>추천 결과</b></li>
            </ol>
          </section>

          <form class="form-board" id="tripBasicForm" novalidate>
            <div>
              <h2><label for="tripName">여행 이름</label></h2>
              <input
                class="input-button"
                id="tripName"
                name="tripName"
                type="text"
                maxlength="50"
                autocomplete="off"
                placeholder="예: 제주도 여름휴가"
              />
              <p class="field-error" id="tripNameError" aria-live="polite"></p>

              <h2>어디로 떠나시나요?</h2>
              <button class="input-button" type="button" data-modal="destination">도시, 국가 또는 공항 검색</button>
              <div class="segmented small">
                <button class="selected" type="button">국내</button>
                <button type="button">해외</button>
              </div>

              <h2>여행 기간</h2>
              <div class="date-pair">
                <div class="date-field">
                  <label for="startDate">시작일</label>
                  <input id="startDate" name="startDate" type="date" />
                  <p class="field-error" id="startDateError" aria-live="polite"></p>
                </div>
                <div class="date-field">
                  <label for="endDate">종료일</label>
                  <input id="endDate" name="endDate" type="date" />
                  <p class="field-error" id="endDateError" aria-live="polite"></p>
                </div>
              </div>
              <p class="trip-duration" id="tripDuration" aria-live="polite">여행 기간을 선택해주세요.</p>
            </div>

            <div>
              <h2>동행자 유형</h2>
              <div class="choice-grid" id="companionOptions">
                <button type="button" data-companion="ALONE" aria-pressed="false">혼자</button>
                <button type="button" data-companion="FRIEND" aria-pressed="false">친구</button>
                <button type="button" data-companion="COUPLE" aria-pressed="false">연인</button>
                <button type="button" data-companion="FAMILY" aria-pressed="false">가족</button>
                <button type="button" data-companion="PARENTS" aria-pressed="false">부모님</button>
                <button type="button" data-companion="CHILDREN" aria-pressed="false">아이와 함께</button>
              </div>
              <p class="field-error" id="companionError" aria-live="polite"></p>

              <h2>예상 예산</h2>
              <button class="input-button" type="button">1인 기준 300,000원</button>
            </div>

            <p class="form-message" id="basicFormMessage" aria-live="polite"></p>
            <button class="primary-button form-next" id="basicNextButton" type="submit">
              다음 · 스타일 설정
            </button>
          </form>
        </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}">
        <div id="directory-root"></div>
        <div id="modal-root"></div>
        <div id="toast-root" aria-live="polite"></div>
      </div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/trips/basic.js}" src="../../static/js/pages/trips/basic.js"></script>
  </body>
</html>
