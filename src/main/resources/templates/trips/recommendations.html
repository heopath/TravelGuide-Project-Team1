<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행지 추천" />
    <title>여행지 추천 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/recommendations.css}" href="../../static/css/pages/trips/recommendations.css" />
  </head>
  <body class="page-recommendations" data-route="/trips/recommendations">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell">
    <section class="page-heading basic-wizard-heading">
      <ol class="wizard">
        <li class="done"><span>1</span><b>기본정보</b><i></i></li>
        <li class="done"><span>2</span><b>여행 스타일</b><i></i></li>
        <li class="active"><span>3</span><b>추천결과</b><i></i></li>
        <li><span>4</span><b>여행일정</b></li>
      </ol>
    </section>

    <section class="page-heading">
      <div>
        <h1 id="recommendationTitle"><span>03 </span>맞춤 여행지 추천</h1>
        <p>입력한 조건을 분석한 AI 추천 결과입니다.</p>
        <i>✦</i>
      </div>
      <span class="condition-label">연인 · 3박 4일 · 맛집 · 사진</span>
    </section>
  
      <div class="destination-grid">
        
          <article class="destination-card">
            <div class="visual tone-blue"></div>
            <div class="destination-copy"><h2>부산</h2><p>바다와 미식이 만나는 도시</p>
              <div class="score-row"><span>추천 일치도</span><strong>96%</strong></div>
              <div class="progress"><i style="width:96%"></i></div>
              <button class="primary-button wide" type="button" data-select-destination="부산">부산으로 계획하기</button>
            </div>
          </article>
        
          <article class="destination-card">
            <div class="visual tone-sunset"></div>
            <div class="destination-copy"><h2>여수</h2><p>낭만적인 밤바다 여행</p>
              <div class="score-row"><span>추천 일치도</span><strong>91%</strong></div>
              <div class="progress"><i style="width:91%"></i></div>
              <button class="outline-button wide" type="button" data-select-destination="여수">선택하기</button>
            </div>
          </article>
        
          <article class="destination-card">
            <div class="visual tone-mint"></div>
            <div class="destination-copy"><h2>제주</h2><p>자연 속 여유로운 섬 여행</p>
              <div class="score-row"><span>추천 일치도</span><strong>89%</strong></div>
              <div class="progress"><i style="width:89%"></i></div>
              <button class="outline-button wide" type="button" data-select-destination="제주">선택하기</button>
            </div>
          </article>
        
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/trips/recommendations.js}" src="../../static/js/pages/trips/recommendations.js"></script>
  </body>
</html>
