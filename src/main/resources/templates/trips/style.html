<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="All My Trips 여행 스타일" />
  <title>여행 스타일 — All My Trips</title>
  <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
  <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
  <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
  <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
  <link rel="stylesheet" th:href="@{/css/pages/trips/style.css(v=20260803-wizard-unified)}" href="../../static/css/pages/trips/style.css?v=20260803-wizard-unified" />
</head>
<body class="page-style" data-route="/trips/new/style">
<div class="app">
  <div th:replace="~{fragments/header :: header('trips')}"></div>
  <main id="page-content">
    <section class="page-shell">
      <section class="page-heading basic-wizard-heading">
        <ol class="wizard">
          <li><span>1</span><b>계획 방식</b><i></i></li>
          <li class="done"><span>2</span><b>기본 정보</b><i></i></li>
          <li class="active"><span>3</span><b>여행 스타일</b><i></i></li>
          <li data-final-step><span>4</span><b>여행 일정</b></li>
        </ol>
      </section>
      <section class="style-board">
        <div class="style-form-area">
          <div class="style-section">
            <h2>여행 목적</h2>
            <div class="pill-grid" id="purposeOptions">
              <button type="button" data-style-group="purpose" data-style-value="SIGHTSEEING" aria-pressed="false">관광</button>
              <button type="button" data-style-group="purpose" data-style-value="FOOD" aria-pressed="false">맛집</button>
              <button type="button" data-style-group="purpose" data-style-value="CAFE" aria-pressed="false">카페</button>
              <button type="button" data-style-group="purpose" data-style-value="HEALING" aria-pressed="false">힐링</button>
              <button type="button" data-style-group="purpose" data-style-value="SHOPPING" aria-pressed="false">쇼핑</button>
              <button type="button" data-style-group="purpose" data-style-value="ACTIVITY" aria-pressed="false">액티비티</button>
              <button type="button" data-style-group="purpose" data-style-value="CULTURE" aria-pressed="false">문화·전시</button>
              <button type="button" data-style-group="purpose" data-style-value="PHOTO" aria-pressed="false">사진</button>
              <button type="button" data-style-group="purpose" data-style-value="NATURE" aria-pressed="false">자연·풍경</button>
              <button type="button" data-style-group="purpose" data-style-value="NIGHT" aria-pressed="false">야경·야간</button>
              <button type="button" data-style-group="purpose" data-style-value="LOCAL" aria-pressed="false">로컬 체험</button>
              <button type="button" data-style-group="purpose" data-style-value="FAMILY" aria-pressed="false">가족 체험</button>
            </div>
            <p class="field-error" id="purposeError" aria-live="polite"></p>
          </div>
          <div class="style-section">
            <h2>일정 속도</h2>
            <div class="schedule-scale" id="scheduleOptions" role="group" aria-label="일정 속도 선택">
              <div class="schedule-scale-track" aria-hidden="true"></div>
              <button type="button" data-style-group="schedule" data-style-value="VERY_RELAXED" aria-pressed="false">
                <span class="schedule-step">01</span>
                <strong>아주여유롭게</strong>
              </button>
              <button type="button" data-style-group="schedule" data-style-value="RELAXED" aria-pressed="false">
                <span class="schedule-step">02</span>
                <strong>여유로운</strong>
              </button>
              <button type="button" data-style-group="schedule" data-style-value="BALANCED" aria-pressed="false">
                <span class="schedule-step">03</span>
                <strong>균형있는</strong>
              </button>
              <button type="button" data-style-group="schedule" data-style-value="FULL" aria-pressed="false">
                <span class="schedule-step">04</span>
                <strong>알찬</strong>
              </button>
              <button type="button" data-style-group="schedule" data-style-value="THEME_FOCUSED" aria-pressed="false">
                <span class="schedule-step">05</span>
                <strong>테마집중</strong>
              </button>
            </div>
            <p class="field-error" id="scheduleError" aria-live="polite"></p>
          </div>
          <div class="style-section">
            <h2>이동 선호</h2>
            <div class="pill-grid" role="group" aria-label="이동 선호 선택">
              <button type="button" data-style-group="transport" data-style-value="PUBLIC_TRANSIT">대중교통</button>
              <button type="button" data-style-group="transport" data-style-value="CAR">자차·렌터카</button>
              <button type="button" data-style-group="transport" data-style-value="TAXI">택시</button>
              <button type="button" data-style-group="transport" data-style-value="WALK_BIKE">도보·자전거</button>
              <button type="button" data-style-group="transport" data-style-value="MIXED">상황에 따라 혼합</button>
              <button type="button" data-style-group="transport" data-style-value="NO_PREFERENCE">선호없음</button>
            </div>
            <p class="field-error" id="transportError" aria-live="polite"></p>
          </div>
          <div class="style-section">
            <h2>음식 선호</h2>
            <div class="pill-grid" role="group" aria-label="음식 선호 선택">
              <button type="button" data-style-group="food" data-style-value="LOCAL">로컬 맛집</button>
              <button type="button" data-style-group="food" data-style-value="FAMOUS">유명 맛집</button>
              <button type="button" data-style-group="food" data-style-value="CAFE_DESSERT">카페·디저트</button>
              <button type="button" data-style-group="food" data-style-value="VALUE">가성비 식당</button>
              <button type="button" data-style-group="food" data-style-value="FINE_DINING">고급 식당</button>
              <button type="button" data-style-group="food" data-style-value="VEGETARIAN">채식</button>
              <button type="button" data-style-group="food" data-style-value="NO_PREFERENCE">선호 없음</button>
            </div>
            <p class="field-error" id="foodError" aria-live="polite"></p>
          </div>
          <div class="style-section">
            <h2>숙박 형태</h2>
            <div class="pill-grid" role="group" aria-label="숙박 형태 선택">
              <button type="button" data-style-group="accommodation" data-style-value="HOTEL">호텔</button>
              <button type="button" data-style-group="accommodation" data-style-value="RESORT">리조트</button>
              <button type="button" data-style-group="accommodation" data-style-value="PENSION">펜션·풀빌라</button>
              <button type="button" data-style-group="accommodation" data-style-value="GUESTHOUSE">게스트하우스·호스텔</button>
              <button type="button" data-style-group="accommodation" data-style-value="HANOK">한옥</button>
              <button type="button" data-style-group="accommodation" data-style-value="CAMPING">캠핑·글램핑</button>
              <button type="button" data-style-group="accommodation" data-style-value="NO_PREFERENCE">선호 없음</button>
            </div>
            <p class="field-error" id="accommodationError" aria-live="polite"></p>
          </div>
        </div>
        <aside class="selected-summary">
          <div class="boarding-pass-title" aria-live="polite">
            <strong id="tripTitleDisplay">나의 여행</strong>
            <button id="tripTitleEditButton" type="button" aria-label="여행 이름 수정">수정</button>
          </div>
          <div class="boarding-pass-title-editor" id="tripTitleEditor" hidden>
            <label for="tripTitleInput">여행 이름</label>
            <div>
              <input id="tripTitleInput" type="text" maxlength="20" />
              <button id="tripTitleSaveButton" type="button">저장</button>
              <button id="tripTitleCancelButton" type="button">취소</button>
            </div>
            <p id="tripTitleError" aria-live="polite"></p>
          </div>
          <h2>여행 취향</h2>
          <strong id="basicSummary">기본정보를 확인해주세요.</strong>
          <strong id="purposeSummary">여행 목적을 선택해주세요.</strong>
          <strong id="styleSummary">일정과 이동 선호를 선택해주세요.</strong>
          <strong id="preferenceSummary">음식과 숙박 선호를 선택해주세요.</strong>
          <div class="style-actions">
            <button class="secondary-button" id="stylePreviousButton" type="button">이전</button>
            <button class="primary-button style-next" id="styleNextButton" type="button">AI 추천 결과 보기</button>
          </div>
        </aside>
        <p class="form-message" id="styleFormMessage" tabindex="-1" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <div th:replace="~{fragments/modals :: modalRoots}">
    <div id="directory-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>
  <div th:replace="~{fragments/footer :: footer}"></div>
</div>
<div th:replace="~{fragments/scripts :: appScripts}"></div>
<script th:src="@{/js/pages/trips/style.js}" src="../../static/js/pages/trips/style.js"></script>
</body>
</html>
