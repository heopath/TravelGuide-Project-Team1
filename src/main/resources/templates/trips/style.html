<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 스타일" />
    <title>여행 스타일 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/style.css}" href="../../static/css/pages/trips/style.css" />
  </head>
  <body class="page-style" data-route="/trips/new/style">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>01 </span>나의 여행 스타일</h1>
        <p>좋아하는 키워드를 여러 개 골라주세요.</p>
        <i>✦</i>
      </div>
      
    <ol class="wizard">
      
        <li class="done">
          <span>1</span><b>기본 정보</b><i></i>
        </li>
      
        <li class="active">
          <span>2</span><b>여행 스타일</b><i></i>
        </li>
      
        <li class="">
          <span>3</span><b>추천 결과</b>
        </li>
      
    </ol>
  
    </section>
  
      <section class="style-board">
        <div>
          <h2>여행 목적</h2>
          <div class="pill-grid" data-purpose-group><button type="button" class="selected" data-toggle>관광</button><button type="button" class="selected" data-toggle>맛집</button><button type="button" data-toggle>카페</button><button type="button" data-toggle>힐링</button><button type="button" data-toggle>쇼핑</button><button type="button" data-toggle>액티비티</button><button type="button" data-toggle>문화·전시</button><button type="button" class="selected" data-toggle>사진</button></div>
          <h2>일정 스타일</h2><div class="segmented" data-pace-group><button type="button" class="selected" data-toggle-group data-value="RELAXED">여유로운 여행</button><button type="button" data-toggle-group data-value="NORMAL">일반적인 여행</button><button type="button" data-toggle-group data-value="PACKED">꽉 찬 여행</button></div>
          <h2>예산 스타일</h2><div class="segmented" data-budget-style-group><button type="button" data-toggle-group data-value="VALUE">가성비 여행</button><button type="button" class="selected" data-toggle-group data-value="STANDARD">일반 여행</button><button type="button" data-toggle-group data-value="LUXURY">럭셔리 여행</button></div>
        </div>
        <aside class="selected-summary"><h2>선택한 취향</h2><strong data-style-basic>기본 정보를 먼저 입력해주세요.</strong><strong data-style-purpose>관광 + 맛집 + 사진</strong><strong data-style-options>여유로운 일정 · 일반 예산</strong><p>조건을 바탕으로 여행지를 추천합니다.</p></aside>
        <button class="primary-button style-next" type="button" data-style-next>맞춤 여행지 추천받기</button>
      </section>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/trips/style.js}" src="../../static/js/pages/trips/style.js"></script>
  </body>
</html>
