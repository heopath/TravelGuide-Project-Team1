<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 스타일" />
    <title>여행 스타일 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/trips/style.css}" href="/css/pages/trips/style.css" />
  </head>
  <body class="page-style" data-route="/trips/new/style">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>01 </span>나의 여행 스타일</h1>
        <p>좋아하는 키워드를 여러 개 골라주세요.</p>
        <i>✦</i>
      </div>
      
    <ol class="wizard">
      
        <li class="done">
          <span>1</span><b>기본 정보</b><i></i>
        </li>
      
        <li class="active">
          <span>2</span><b>여행 스타일</b><i></i>
        </li>
      
        <li class="">
          <span>3</span><b>추천 결과</b>
        </li>
      
    </ol>
  
    </section>
  
      <section class="style-board">
        <div>
          <h2>여행 목적</h2>
          <div class="pill-grid"><button class="selected" data-toggle>관광</button><button class="selected" data-toggle>맛집</button><button class="" data-toggle>카페</button><button class="" data-toggle>힐링</button><button class="" data-toggle>쇼핑</button><button class="" data-toggle>액티비티</button><button class="" data-toggle>문화·전시</button><button class="selected" data-toggle>사진</button></div>
          <h2>일정 스타일</h2><div class="segmented"><button class="selected">여유로운 여행</button><button>일반적인 여행</button><button>꽉 찬 여행</button></div>
          <h2>예산 스타일</h2><div class="segmented"><button>가성비 여행</button><button class="selected">일반 여행</button><button>럭셔리 여행</button></div>
        </div>
        <aside class="selected-summary"><h2>선택한 취향</h2><strong>연인 · 3박 4일</strong><strong>관광 + 맛집 + 사진</strong><strong>여유로운 일정 · 일반 예산</strong><p>AI가 조건을 분석해 추천을 준비합니다.</p></aside>
        <button class="primary-button style-next" type="button" data-route="/trips/recommendations">맞춤 여행지 추천받기</button>
      </section>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <script th:src="@{/js/common/api.js}" src="/js/common/api.js" defer></script>
    <script th:src="@{/js/common/navigation.js}" src="/js/common/navigation.js" defer></script>
    <script th:src="@{/js/common/modal.js}" src="/js/common/modal.js" defer></script>
    <script th:src="@{/js/pages/trips/style.js}" src="/js/pages/trips/style.js" defer></script>
  </body>
</html>
