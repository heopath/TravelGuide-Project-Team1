<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 여행 가이드" />
    <title>여행 가이드 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/guide.css}" href="../../static/css/pages/guide/guide.css" />
  </head>
  <body class="page-guide" data-route="/guide">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>03 </span>여행 가이드</h1>
        <p>현지 정보와 인기 장소를 한눈에 확인하세요.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="filter-row"><button class="selected">전체</button><button class="">관광지</button><button class="">맛집</button><button class="">카페</button><button class="">숙소</button><button class="">쇼핑</button><button class="">체험</button><button class="">축제</button></div>
      <div class="guide-layout">
        <section class="white-panel"><h2>지금 많이 찾는 여행지</h2>
          <div class="place-grid"><button class="place-card tone-sunset" data-route="/guide/places/haeundae"><strong>파리</strong><span>프랑스</span></button><button class="place-card tone-mint" data-route="/guide/places/haeundae"><strong>바르셀로나</strong><span>스페인</span></button><button class="place-card tone-blue" data-route="/guide/places/haeundae"><strong>도쿄</strong><span>일본</span></button><button class="place-card tone-violet" data-route="/guide/places/haeundae"><strong>방콕</strong><span>태국</span></button></div>
        </section>
        <aside class="side-stack"><section class="white-panel weather-card"><h2>오늘의 날씨</h2><span>부산, 대한민국</span><strong>☀ 24°C</strong><p>맑음 · 최고 27°</p></section><section class="white-panel info-card"><h2>여행 정보</h2><p>환율 JPY 9.20</p><p>일몰 19:32</p><p>혼잡도 보통</p><p>추천 해운대 야경</p></section></aside>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
