<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips AI 여행계획" />
    <title>AI 여행계획 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/ai-trip-plan.css}" href="../../static/css/pages/guide/ai-trip-plan.css" />
    <link rel="stylesheet" th:href="@{/css/common/mighty.css}" href="../../static/css/common/mighty.css" />
  </head>
  <body class="page-ai-trip-plan" data-route="/ai-trip-plan">
    <div class="app">
      <div th:replace="~{fragments/header :: header('trips')}"></div>
      <main id="page-content">
        <section class="page-shell ai-plan-shell">
          <section class="page-heading">
            <div>
              <span class="section-eyebrow">AI TRIP PLANNER</span>
              <h1 data-plan-heading>AI가 여행계획을 준비하고 있어요</h1>
              <p data-plan-description>입력한 기본정보와 여행 스타일을 바탕으로 일정 초안을 만들고 있어요.</p>
            </div>
            <button type="button" class="outline-button" data-route="/trips/new/style">← 여행 스타일 수정</button>
          </section>

          <section class="trip-condition-card" aria-label="입력한 여행 조건">
            <div><span>목적지</span><strong data-plan-destination>여행지를 입력해 주세요</strong></div>
            <div><span>여행 기간</span><strong data-plan-date>기간을 입력해 주세요</strong></div>
            <div><span>여행 인원</span><strong data-plan-travelers>1명</strong></div>
          </section>

          <div class="ai-plan-layout ai-plan-layout-result">
            <section class="white-panel plan-result" aria-live="polite">
              <div data-plan-loading hidden class="plan-loading"><span>✦</span><p>여행 조건을 분석해 일정 초안을 만들고 있어요.</p></div>
              <div data-plan-error hidden class="plan-error">
                <strong>일정 초안을 만들지 못했어요.</strong>
                <p>입력한 여행 조건을 확인한 뒤 다시 시도해 주세요.</p>
                <button type="button" class="outline-button" data-plan-retry>다시 시도</button>
              </div>
              <section data-plan-result hidden class="plan-result-content">
                <div class="plan-result-main white-panel">
                  <span class="section-eyebrow">YOUR AI PLAN</span>
                  <h2 data-plan-title></h2>
                  <p class="plan-summary" data-plan-summary></p>
                  <p class="plan-source" data-plan-source></p>
                  <section class="plan-map-section">
                    <div class="plan-map-title"><div><span class="section-eyebrow">RECOMMENDED ROUTE</span><h3 data-plan-map-day>DAY 1 추천 장소 지도</h3></div><p>번호 순서대로 이동해 보세요.</p></div>
                    <div class="plan-map" data-plan-map aria-label="AI 추천 장소 지도"></div>
                    <p class="plan-map-status" data-plan-map-status>카카오 지도 준비 중</p>
                  </section>
                </div>
                <aside class="plan-result-side" aria-label="추천 장소와 일별 일정">
                  <ol class="plan-place-list" data-plan-place-list></ol>
                  <div class="plan-day-tabs" data-plan-day-tabs aria-label="일정 날짜 선택"></div>
                  <div class="plan-days" data-plan-days></div>
                </aside>
                <button type="button" class="primary-button plan-save-button" data-plan-save>이 일정으로 직접 수정하기</button>
              </section>
            </section>
          </div>
        </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:if="${kakaoJavascriptKey != null and !kakaoJavascriptKey.isBlank()}"
            th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJavascriptKey}&amp;libraries=services&amp;autoload=false|"></script>
    <script th:src="@{/js/pages/guide/ai-trip-plan.js(v=20260821-title-sync)}" src="../../static/js/pages/guide/ai-trip-plan.js?v=20260821-title-sync" defer></script>
  <div th:replace="~{fragments/mighty :: mighty}"></div>
  <script th:src="@{/js/core/mighty.js}" src="../../static/js/core/mighty.js"></script>
  </body>
</html>
