<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 테마 여행" />
    <title>테마 여행 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/themes.css}" href="../../static/css/pages/guide/themes.css" />
    <link rel="stylesheet" th:href="@{/css/common/mighty.css}" href="../../static/css/common/mighty.css" />
  </head>
  <body class="page-themes" data-route="/guide/themes">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell">
    <section class="page-heading">
      <div>
        <h1><span>03 </span>테마 여행</h1>
        <p>마이티가 지금 주목받는 여행 주제를 모았어요.</p>
        <i>✦</i>
      </div>
      
    </section>
  <div class="theme-grid">
    <button type="button" class="theme-card" data-theme-card data-title="이번 주말 부산 미식 여행" data-destination="부산" data-purpose="맛집,관광" data-nights="2"><div class="visual tone-sunset"></div><strong>이번 주말 부산 미식 여행</strong><span>맛집 8곳 · 2박 3일</span></button>
    <button type="button" class="theme-card" data-theme-card data-title="제주의 조용한 오름과 카페" data-destination="제주" data-purpose="힐링,카페" data-nights="3"><div class="visual tone-mint"></div><strong>제주의 조용한 오름과 카페</strong><span>힐링 6곳 · 3박 4일</span></button>
    <button type="button" class="theme-card" data-theme-card data-title="서울 야경과 전시 산책" data-destination="서울" data-purpose="문화·전시,사진" data-nights="1"><div class="visual tone-blue"></div><strong>서울 야경과 전시 산책</strong><span>문화 7곳 · 1박 2일</span></button>
    <button type="button" class="theme-card" data-theme-card data-title="아이와 함께하는 경주" data-destination="경주" data-purpose="가족,관광" data-nights="2"><div class="visual tone-violet"></div><strong>아이와 함께하는 경주</strong><span>가족 9곳 · 2박 3일</span></button>
  </div></section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/guide/themes.js}" src="../../static/js/pages/guide/themes.js"></script>
  <div th:replace="~{fragments/mighty :: mighty}"></div>
  <script th:src="@{/js/core/mighty.js}" src="../../static/js/core/mighty.js"></script>
  </body>
</html>
