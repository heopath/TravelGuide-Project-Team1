<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips AI 여행 가이드" />
    <title>AI 여행 가이드 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/ai-guide.css}" href="../../static/css/pages/guide/ai-guide.css" />
  </head>
  <body class="page-ai-guide" data-route="/ai-guide">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1>AI 여행 가이드</h1>
        <p>서비스 데이터와 현재 일정을 바탕으로 답해드려요.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="ai-layout">
        <aside class="white-panel ai-context"><h2>여행 컨텍스트</h2><div><span>현재 여행</span><strong>부산 미식 여행 · DAY 1</strong><p>광안리 → 해운대 → 청사포</p></div><h3>추천 질문</h3><button data-chat-question="근처 저녁 맛집 추천">근처 저녁 맛집 추천</button><button data-chat-question="비 오는 날 갈 곳">비 오는 날 갈 곳</button><button data-chat-question="부모님과 가기 좋은 곳">부모님과 가기 좋은 곳</button><button data-chat-question="2시간 안에 볼 수 있는 곳">2시간 안에 볼 수 있는 곳</button></aside>
        <section class="white-panel chat-panel" id="chat-panel"><div class="user-message">근처에서 저녁 먹을 곳 추천해줘.</div><div class="ai-message"><p>현재 DAY 1의 광안리 일정을 기준으로 도보 10분 거리의 민락회센터와 광안리 해변 인근 돼지국밥집을 추천합니다. 예약 가능 여부도 확인할까요?</p><small>근거: 현재 일정 · 부산 맛집 데이터 · 영업시간</small></div><form class="chat-input" data-chat-form><input placeholder="여행에 대해 무엇이든 물어보세요." /><button aria-label="보내기">↑</button></form></section>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
