<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 장소 상세" />
    <title>장소 상세 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/place-detail.css}" href="../../static/css/pages/guide/place-detail.css" />
  </head>
  <body class="page-place-detail" data-route="/guide/place-detail">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell place-detail-shell">
          <button type="button" class="detail-back" data-route="/guide">
            <span aria-hidden="true">←</span> 추천 장소로 돌아가기
          </button>

          <div class="detail-state" data-detail-state aria-live="polite">
            장소 정보를 불러오는 중입니다.
          </div>

          <article class="place-detail" data-detail-content hidden>
            <div class="detail-hero" data-place-image-wrap>
              <img data-place-image alt="" />
              <span class="detail-image-label">PLACE DETAIL</span>
            </div>

            <header class="place-intro">
              <div class="place-intro-meta">
                <span class="category-badge" data-place-category></span>
                <span class="rating-badge"><i aria-hidden="true">★</i><b data-place-rating></b></span>
              </div>
              <h1 data-place-name>장소 상세</h1>
              <p class="place-location-summary" data-place-location></p>
              <p class="place-description" data-place-description></p>
            </header>

            <div class="detail-content-grid">
              <section class="location-panel" aria-labelledby="location-title">
                <div class="section-title-row">
                  <div>
                    <span class="section-eyebrow">LOCATION</span>
                    <h2 id="location-title">위치 정보</h2>
                  </div>
                </div>

                <div class="address-box">
                  <div>
                    <span>장소 주소</span>
                    <strong data-place-address>주소 정보가 없습니다.</strong>
                  </div>
                  <button type="button" class="utility-button" data-address-copy>장소 주소 복사</button>
                </div>

                <div class="place-map" data-place-map>
                  <p data-map-message>지도를 불러오는 중입니다.</p>
                </div>

                <div class="map-actions">
                  <a class="kakao-map-button" data-kakao-map target="_blank" rel="noopener noreferrer">
                    카카오맵에서 보기
                  </a>
                  <a class="route-button" data-kakao-route target="_blank" rel="noopener noreferrer">
                    길찾기
                  </a>
                </div>
              </section>

              <aside class="detail-side">
                <section class="favorite-panel">
                  <span class="section-eyebrow">SAVE PLACE</span>
                  <h2>다음 여행에 담아두세요</h2>
                  <p>찜한 장소는 여행 일정을 만들 때 편하게 불러올 수 있습니다.</p>
                  <button type="button" class="favorite-button" data-favorite-toggle aria-pressed="false">
                    <span class="favorite-heart" aria-hidden="true"></span>
                    <strong>찜하기</strong>
                  </button>
                  <p class="favorite-status" data-favorite-status aria-live="polite"></p>
                </section>

                <section class="utility-panel" aria-label="장소 편의 기능">
                  <button type="button" data-share-place>페이지 링크 공유</button>
                </section>
              </aside>
            </div>
          </article>
        </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script
      th:if="${kakaoJavascriptKey != null and !kakaoJavascriptKey.isBlank()}"
      th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJavascriptKey}&amp;autoload=false|"
    ></script>
    <script th:src="@{/js/pages/guide/place-detail.js}" src="../../static/js/pages/guide/place-detail.js"></script>
  </body>
</html>
