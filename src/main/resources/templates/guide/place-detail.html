<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 장소 상세" />
    <title>장소 상세 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/guide/place-detail.css}" href="../../static/css/pages/guide/place-detail.css" />
  </head>
  <body class="page-place-detail" data-route="/guide/place-detail">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <button type="button" class="detail-back" data-route="/guide">← 추천 장소</button>
        <h1><span>03 </span><b data-place-name>장소 상세</b></h1>
        <p data-place-summary>장소 정보를 불러오는 중입니다.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="detail-state white-panel" data-detail-state aria-live="polite">
        장소 정보를 불러오는 중입니다.
      </div>
      <div class="detail-layout" data-detail-content hidden>
        <div>
          <div class="detail-hero">
            <img data-place-image alt="" />
            <div class="detail-hero-overlay">
              <span data-place-location></span>
              <strong data-place-category></strong>
            </div>
          </div>
          <div class="detail-facts">
            <div><span>평점</span><strong data-place-rating></strong></div>
            <div><span>지역</span><strong data-place-region></strong></div>
            <div><span>카테고리</span><strong data-place-category-fact></strong></div>
          </div>
          <section class="white-panel text-panel">
            <h2>장소 소개</h2>
            <p data-place-description></p>
            <div class="style-chips" data-place-styles></div>
          </section>
        </div>
        <aside class="white-panel booking-aside">
          <span>PLACE INFORMATION</span>
          <h2>방문 정보</h2>
          <dl class="place-contact">
            <div data-address-row><dt>주소</dt><dd data-place-address></dd></div>
            <div data-phone-row><dt>전화</dt><dd data-place-phone></dd></div>
          </dl>
          <button type="button" class="favorite-button wide" data-favorite-toggle
                  aria-pressed="false">
            <span aria-hidden="true">♡</span>
            <strong>찜하기</strong>
          </button>
          <a class="outline-button wide place-website" data-place-website
             target="_blank" rel="noopener noreferrer">공식 웹사이트</a>
        </aside>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/guide/place-detail.js}" src="../../static/js/pages/guide/place-detail.js"></script>
  </body>
</html>
