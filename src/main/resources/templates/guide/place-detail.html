<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>

    <meta name="description" content="All My Trips 장소 상세" />
    <title>장소 상세 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="/css/common/layout.css" />

  <body class="page-place-detail" data-route="/guide/places/haeundae">
    <div class="app">
      <div th:replace="~{fragments/header :: header('guide')}"></div>
      <main id="page-content">
        <section class="page-shell">
      
    <section class="page-heading">
      <div>
        <h1><span>03 </span>해운대 블루라인파크</h1>
        <p>바다를 따라 달리는 부산의 대표 해안 관광 명소.</p>
        <i>✦</i>
      </div>
      
    </section>
  
      <div class="detail-layout">
        <div><div class="detail-hero tone-blue"><span>BUSAN · HAEUNDAE</span></div>
          <div class="detail-facts"><div><span>평점</span><strong>4.8 / 5</strong></div><div><span>관람 시간</span><strong>약 90분</strong></div><div><span>추천 시간</span><strong>오후 4시</strong></div><div><span>혼잡도</span><strong>보통</strong></div></div>
          <section class="white-panel text-panel"><h2>마이티 한 줄 가이드</h2><p>미포에서 청사포 방향으로 이동하면 석양과 바다 풍경을 가장 오래 즐길 수 있어요.</p></section>
        </div>
        <aside class="white-panel booking-aside"><span>AI 추천 일정</span><h2>DAY 1 · 10:30</h2><p>해운대 해변 다음 코스로 자연스럽게 이어집니다.</p><button class="primary-button wide" data-modal="add-place">일정에 추가</button><button class="outline-button wide" data-route="/booking/tickets/blueline">티켓 보기</button></aside>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <script th:src="@{/js/common/api.js}" src="/js/common/api.js" defer></script>
    <script th:src="@{/js/common/navigation.js}" src="/js/common/navigation.js" defer></script>
    <script th:src="@{/js/common/modal.js}" src="/js/common/modal.js" defer></script>
    <script th:src="@{/js/pages/guide/place-detail.js}" src="/js/pages/guide/place-detail.js" defer></script>
