<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 메인 화면" />
    <title>메인 화면 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/home/home.css}" href="../../static/css/pages/home/home.css" />
    <link rel="stylesheet" th:href="@{/css/common/mighty.css}" href="../../static/css/common/mighty.css" />
  </head>
  <body class="page-home" data-route="/home">
    <div class="app">
      <div th:replace="~{fragments/header :: header('home')}"></div>
      <main id="page-content">
        <section class="home-page">
          <div class="home-scroll-world" data-scroll-world>
            <div class="home-world-stage">
              <video
                class="home-world-video"
                data-world-video
                th:src="@{/media/all-my-trips-world.mp4(v=4)}"
                src="../../static/media/all-my-trips-world.mp4?v=4"
                muted
                playsinline
                preload="auto"
                aria-label="All My Trips 여행 세계 영상"
              ></video>
              <div class="home-world-shade" aria-hidden="true"></div>

              <div class="home-hero" data-world-intro>
                <div class="hero-logo">
                  <img th:src="@{/images/icons/app-icon.png}" src="../../static/images/icons/app-icon.png" alt="" />
                  <span>나만의 여행이 시작되는 곳</span>
                  <h1>All My Trips</h1>
                  <p>마이티와 함께, 상상하던 여행 속으로.</p>
                </div>
                <button class="home-start-button" type="button" data-world-start>여행 계획하기 <b>→</b></button>
              </div>

              <div class="home-world-finale" data-world-finale>
                <span>YOUR TRIP, YOUR STORY</span>
                <h2>이제, 당신의 여행을<br />시작해 보세요.</h2>
                <button type="button" data-route="/trips/new/plan">AI 여행계획 만들기 <b>→</b></button>
              </div>

              <div class="home-world-progress" aria-hidden="true"><i data-world-progress></i></div>
              <div class="home-scroll-hint" data-world-hint aria-hidden="true">
                <span>SCROLL TO TRAVEL</span><i></i>
              </div>
              <button class="home-world-skip" type="button" data-world-skip hidden>건너뛰기 <b>→</b></button>
            </div>
          </div>
        </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/home/home.js}" src="../../static/js/pages/home/home.js"></script>
  <div th:replace="~{fragments/mighty :: mighty}"></div>
  <script th:src="@{/js/core/mighty.js}" src="../../static/js/core/mighty.js"></script>
  </body>
</html>
