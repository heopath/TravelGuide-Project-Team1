<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 회원가입" />
    <title>회원가입 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/auth/signup.css}" href="../../static/css/pages/auth/signup.css" />
  </head>
  <body class="page-signup" data-route="/auth/signup">
    <div class="app">
      <div th:replace="~{fragments/header :: header('auth')}"></div>
      <main id="page-content">
        <section class="page-shell">
      <div class="auth-layout">
        <section class="auth-copy">
          <img th:src="@{/images/logo/brand-stacked.png}" src="../../static/images/logo/brand-stacked.png" alt="All My Trips" />
          <span>YOUR TRIP, ONE FLOW</span>
          <h1>여행이 일상이 되는 시작</h1>
          <p>여행 계획부터 예약과 기록까지 하나의 계정으로 이어가세요.</p>
        </section>
        <form class="auth-card" data-demo-form data-next="/trips/new/basic">
          <div class="section-eyebrow">03 회원가입</div>
          <h2>All My Trips 시작하기</h2>
          <label class="field"><span>이메일</span><input type="email" placeholder="trip@example.com" required /></label>
          <label class="field"><span>비밀번호</span><input type="password" placeholder="8자 이상 입력" required /></label>
          
            <label class="field"><span>닉네임</span><input placeholder="여행에서 사용할 이름" required /></label>
            <label class="check-line"><input type="checkbox" required /> 필수 약관에 동의합니다.
              <button type="button" data-modal="terms">내용 보기</button>
            </label>
          
          <button class="primary-button wide">회원가입 완료</button>
          <div class="auth-switch">이미 계정이 있나요?
            <button type="button" data-route="/auth/login">로그인</button>
          </div>
        </form>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
  </body>
</html>
