<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 비밀번호 찾기" />
    <title>비밀번호 찾기 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/auth/login.css}" href="../../static/css/pages/auth/login.css" />
  </head>
  <body class="page-login" data-route="/auth/forgot-password">
    <div class="app">
      <div th:replace="~{fragments/header :: header('auth')}"></div>
      <main id="page-content">
        <section class="page-shell">
      <div class="auth-layout">
        <section class="auth-copy">
          <img th:src="@{/images/logo/brand-stacked.png}" src="../../static/images/logo/brand-stacked.png" alt="All My Trips" />
          <span>YOUR TRIP, ONE FLOW</span>
          <h1>비밀번호를 잊으셨나요</h1>
          <p>가입할 때 쓴 이메일을 알려 주시면 새 비밀번호를 정할 수 있는 링크를 보내 드립니다.</p>
        </section>
        <form id="forgot-form" class="auth-card">
          <div class="section-eyebrow">비밀번호 찾기</div>
          <h2>재설정 링크 받기</h2>

          <label class="field">
            <span>이메일</span>
            <input
                    id="forgot-email"
                    name="email"
                    type="email"
                    placeholder="trip@example.com"
                    autocomplete="email"
                    required
            />
          </label>

          <p id="forgot-error" class="notice danger" role="alert" hidden></p>
          <p id="forgot-done" class="notice" role="status" hidden></p>

          <button id="forgot-submit" type="submit" class="primary-button wide">
            재설정 링크 보내기
          </button>

          <div class="auth-switch">
            비밀번호가 기억나셨나요?
            <button type="button" data-route="/auth/login">로그인</button>
          </div>
        </form>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/auth/forgot-password.js}"
            src="../../static/js/pages/auth/forgot-password.js"></script>
  </body>
</html>
