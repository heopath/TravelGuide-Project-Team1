<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 로그인" />
    <title>로그인 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/auth/login.css}" href="../../static/css/pages/auth/login.css" />
    <script th:if="${turnstileEnabled}" src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body class="page-login" data-route="/auth/login">
    <div class="app">
      <div th:replace="~{fragments/header :: header('auth')}"></div>
      <main id="page-content">
        <section class="page-shell">
      <div class="auth-layout">
        <section class="auth-copy">
          <img th:src="@{/images/logo/brand-stacked.png}" src="../../static/images/logo/brand-stacked.png" alt="All My Trips" />
          <span>YOUR TRIP, ONE FLOW</span>
          <h1>다시 만나 반가워요</h1>
          <p>여행 계획부터 예약과 기록까지 하나의 계정으로 이어가세요.</p>
        </section>
        <form id="login-form" class="auth-card">
          <div class="section-eyebrow">02 로그인</div>
          <h2>계정에 로그인하기</h2>

          <label class="field">
            <span>이메일</span>
            <input
                    id="login-email"
                    name="email"
                    type="email"
                    placeholder="trip@example.com"
                    autocomplete="email"
                    required
            />
          </label>

          <label class="field">
            <span>비밀번호</span>
            <input
                    id="login-password"
                    name="password"
                    type="password"
                    placeholder="8자 이상 입력"
                    autocomplete="current-password"
                    required
            />
          </label>

          <div th:if="${turnstileEnabled}"
               class="cf-turnstile"
               th:attr="data-sitekey=${turnstileSiteKey}"
               data-action="login"
               data-theme="light"></div>

          <p id="login-error" class="notice danger" role="alert" hidden></p>

          <button id="login-submit" type="submit" class="primary-button wide">
            로그인
          </button>

          <div class="auth-switch">
            계정이 없나요?
            <button type="button" data-route="/auth/signup">회원가입</button>
          </div>
        </form>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/auth/login.js}"
            src="../../static/js/pages/auth/login.js"></script>
  </body>
</html>
