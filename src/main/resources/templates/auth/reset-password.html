<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="All My Trips 비밀번호 재설정" />
    <title>비밀번호 재설정 — All My Trips</title>
    <link rel="icon" th:href="@{/images/icons/app-icon.png}" href="../../static/images/icons/app-icon.png" />
    <link rel="stylesheet" th:href="@{/css/common/reset.css}" href="../../static/css/common/reset.css" />
    <link rel="stylesheet" th:href="@{/css/common/layout.css}" href="../../static/css/common/layout.css" />
    <link rel="stylesheet" th:href="@{/css/common/components.css}" href="../../static/css/common/components.css" />
    <link rel="stylesheet" th:href="@{/css/pages/auth/login.css}" href="../../static/css/pages/auth/login.css" />
  </head>
  <body class="page-login" data-route="/auth/reset-password">
    <div class="app">
      <div th:replace="~{fragments/header :: header('auth')}"></div>
      <main id="page-content">
        <section class="page-shell">
      <div class="auth-layout">
        <section class="auth-copy">
          <img th:src="@{/images/logo/brand-stacked.png}" src="../../static/images/logo/brand-stacked.png" alt="All My Trips" />
          <span>YOUR TRIP, ONE FLOW</span>
          <h1>새 비밀번호를 정해 주세요</h1>
          <p>8자 이상으로 정해 주세요. 링크는 한 번만 쓸 수 있습니다.</p>
        </section>
        <form id="reset-form" class="auth-card">
          <div class="section-eyebrow">비밀번호 재설정</div>
          <h2>새 비밀번호 설정</h2>

          <label class="field">
            <span>새 비밀번호</span>
            <input
                    id="reset-password"
                    name="newPassword"
                    type="password"
                    placeholder="8자 이상 입력"
                    autocomplete="new-password"
                    minlength="8"
                    required
            />
          </label>

          <label class="field">
            <span>새 비밀번호 확인</span>
            <input
                    id="reset-password-confirm"
                    name="newPasswordConfirm"
                    type="password"
                    placeholder="한 번 더 입력"
                    autocomplete="new-password"
                    minlength="8"
                    required
            />
          </label>

          <p id="reset-error" class="notice danger" role="alert" hidden></p>
          <p id="reset-done" class="notice" role="status" hidden></p>

          <button id="reset-submit" type="submit" class="primary-button wide">
            비밀번호 변경
          </button>

          <div class="auth-switch">
            <button type="button" data-route="/auth/login">로그인으로 돌아가기</button>
          </div>
        </form>
      </div>
    </section>
      </main>
      <div th:replace="~{fragments/modals :: modalRoots}"><div id="directory-root"></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div></div>
      <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
    <div th:replace="~{fragments/scripts :: appScripts}"></div>
    <script th:src="@{/js/pages/auth/reset-password.js}"
            src="../../static/js/pages/auth/reset-password.js"></script>
  </body>
</html>
