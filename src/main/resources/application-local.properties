spring.docker.compose.enabled=false
# GoogleGenAiChatAutoConfiguration은 제외 목록에 넣지 않는다.
# ai 프로필을 덧씌운 local,ai 조합에서 ChatModel 빈이 만들어져야 하기 때문이며,
# local 단독 실행은 아래 spring.ai.model.chat=none 만으로 ChatModel이 생성되지 않는다.
spring.autoconfigure.exclude=\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration,\
org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration,\
org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# local 프로필 전용이며 Release/운영 DB 인증정보는 환경변수·Secret으로 주입한다.
# PostgreSQL 로컬 접속 정보: compose.yaml의 DB명·계정·포트와 함께 변경한다.
# citext, pgcrypto, vector 확장은 DB 관리자 계정으로 database/init/create_extensions.sql을 먼저 실행한다.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/all_my_trips}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:allmytrips}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-secret}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=org.example.all_my_trip_project.domain
mybatis.configuration.map-underscore-to-camel-case=true

spring.jpa.hibernate.ddl-auto=none
# 빈 PostgreSQL DB에 classpath의 V1~V7을 순서대로 적용한다. 운영/공유 DB에서는 적용 이력을 먼저 확인한다.
spring.flyway.enabled=true

# 장소 상세 캐시는 10분 후 만료되며 장소 수정·삭제 시 Service에서 즉시 제거한다.
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=all-my-trips:
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ai 프로필을 덧씌우면(local,ai) 아래 값이 google-genai로 대체된다.
spring.ai.model.chat=none
spring.ai.model.embedding.text=none

# 로컬에서는 템플릿 수정이 바로 반영되어야 한다.
spring.thymeleaf.cache=false
